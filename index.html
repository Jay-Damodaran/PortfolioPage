</head>
<body>

  <!-- ============================================================ -->
  <!-- 1. Hero — rotating photos + cycling statements                -->
  <!-- ============================================================ -->
  <section id="hero" class="hero">
    <div id="hero-photos" class="hero-photos" aria-label="Photos of Jay"></div>
    <div class="hero-text">
      <h1>Hi, I'm Jay.</h1>
      <p id="hero-statement" class="hero-statement"></p>
      <div id="hero-bubbles" class="hero-bubbles" aria-label="Statement tracker"></div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 2. Education — animated step-by-step reveal                   -->
  <!-- ============================================================ -->
  <section id="education" class="section">
    <h2 class="section-title">Education</h2>
    <div id="education-steps" class="education-steps"><!-- filled by main.js --></div>
  </section>

  <!-- ============================================================ -->
  <!-- 3. Portfolio — Timeline / List / Detailed List                -->
  <!-- ============================================================ -->
  <section id="portfolio" class="section">
    <h2 class="section-title">Portfolio</h2>

    <div class="portfolio-toolbar">
      <label class="view-label" for="portfolio-view-select">View:</label>
      <select id="portfolio-view-select" class="view-select">
        <option value="timeline" selected>Timeline</option>
        <option value="list">List</option>
        <option value="detailed">Detailed List</option>
      </select>

      <!-- Zoom controls apply to the Timeline view (Ctrl+scroll also zooms). -->
      <div class="tl-zoom-controls">
        <button id="tl-zoom-out" class="tl-zoom-btn" aria-label="Zoom out">−</button>
        <button id="tl-zoom-in" class="tl-zoom-btn" aria-label="Zoom in">+</button>
      </div>

      <!-- Color legend for node types -->
      <div class="tl-legend" role="list" aria-label="Item type color legend">
        <span class="legend-item" style="--type-color:#81c784">Work</span>
        <span class="legend-item" style="--type-color:#b39dfb">Experience</span>
        <span class="legend-item" style="--type-color:#4fc3f7">Project</span>
        <span class="legend-item" style="--type-color:#ffd54f">Competition</span>
      </div>
    </div>

    <!-- Timeline view (default): nervous-system nerve with branching events -->
    <div id="view-timeline" class="portfolio-view">
      <div id="timeline-scroll" class="timeline-scroll">
        <div id="timeline-svg-host" class="timeline-svg-host"><!-- SVG injected by portfolio.js --></div>
      </div>
      <!-- Custom scrollbar: nerve track + action-potential spike thumb -->
      <div id="ap-scrollbar" class="ap-scrollbar">
        <div class="ap-track"></div>
        <div class="ap-thumb" tabindex="0" role="slider" aria-label="Scroll timeline"
             aria-orientation="horizontal">
          <svg viewBox="0 0 60 24" class="ap-spike">
            <path d="M0 16 L18 16 L24 4 L30 22 L36 16 L60 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- List view: squircle cards, grouped by type -->
    <div id="view-list" class="portfolio-view" hidden><!-- filled by portfolio.js --></div>

    <!-- Detailed List view: full detail blocks down the page -->
    <div id="view-detailed" class="portfolio-view" hidden><!-- filled by portfolio.js --></div>
  </section>

  <!-- ============================================================ -->
  <!-- 4. Certifications                                             -->
  <!-- ============================================================ -->
  <section id="certifications" class="section">
    <h2 class="section-title">Certifications</h2>
    <div id="cert-columns" class="cert-columns"><!-- filled by portfolio.js --></div>
  </section>

  <!-- ============================================================ -->
  <!-- 5. Endorsements                                               -->
  <!-- ============================================================ -->
  <section id="endorsements" class="section">
    <h2 class="section-title">Endorsements</h2>
    <div id="endorsement-cards" class="endorsement-cards"><!-- filled by portfolio.js --></div>
  </section>

  <!-- ============================================================ -->
  <!-- Shared detail-card modal (used by Timeline and List views)    -->
  <!-- ============================================================ -->
  <div id="detail-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" aria-label="Close">×</button>
      <div class="modal-body"><!-- shared detail renderer output --></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
